<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raven's Eye - Bird Watcher Log</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <!-- Sleek, minimal gothic raven -->
                <svg class="raven-icon" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="ravenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#c9a961;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#8b7355;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <!-- Head (small, sleek) -->
                    <ellipse cx="50" cy="25" rx="10" ry="12" fill="url(#ravenGradient)"/>
                    <!-- Beak (long, pointed) -->
                    <path d="M 58 25 L 78 23 L 58 27 Z" fill="url(#ravenGradient)"/>
                    <!-- Eye -->
                    <circle cx="54" cy="22" r="1.5" fill="#1a1a1a"/>
                    <!-- Neck -->
                    <path d="M 48 35 L 46 50" stroke="url(#ravenGradient)" stroke-width="6" fill="none" stroke-linecap="round"/>
                    <!-- Body (sleek, tapered) -->
                    <path d="M 45 50 Q 35 60 38 85 Q 45 100 55 100 Q 62 100 65 85 Q 68 60 55 50 Q 50 48 45 50" fill="url(#ravenGradient)"/>
                    <!-- Wings (angular, gothic) -->
                    <path d="M 42 60 Q 25 70 22 90" stroke="url(#ravenGradient)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
                    <path d="M 62 60 Q 78 70 82 90" stroke="url(#ravenGradient)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
                    <!-- Tail feather accent -->
                    <path d="M 50 100 L 48 115" stroke="url(#ravenGradient)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                </svg>
                <h1>Raven's Eye</h1>
                <p class="tagline">A personal bird-watching log</p>
            </div>
        </header>

        <!-- Main Form -->
        <main class="main-content">
            <section class="form-section">
                <div class="form-header">
                    <!-- Minimal icon for log a sighting -->
                    <svg class="log-icon" viewBox="0 0 50 60" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#c9a961;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#8b7355;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <!-- Head (small, sleek) -->
                        <ellipse cx="25" cy="12" rx="7" ry="9" fill="url(#logGradient)"/>
                        <!-- Beak (pointed) -->
                        <path d="M 31 12 L 43 11 L 31 14 Z" fill="url(#logGradient)"/>
                        <!-- Eye -->
                        <circle cx="29" cy="10" r="1" fill="#1a1a1a"/>
                        <!-- Body (sleek) -->
                        <path d="M 23 20 Q 15 28 17 45 Q 22 52 30 52 Q 35 52 38 45 Q 40 28 33 20 Q 28 18 23 20" fill="url(#logGradient)"/>
                        <!-- Wing accent -->
                        <path d="M 20 30 Q 10 35 8 45" stroke="url(#logGradient)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
                    </svg>
                    <h2>Log a Sighting</h2>
                </div>

                <form id="sightingForm" class="sighting-form">
                    <!-- Bird Type -->
                    <div class="form-group">
                        <label for="birdType">Bird Type</label>
                        <select id="birdType" name="birdType" required>
                            <option value="">Select a bird...</option>
                            <option value="crow">Crow</option>
                            <option value="jay">Jay</option>
                            <option value="robin">Robin</option>
                            <option value="raven">Raven</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <!-- Specific Bird Name (optional) -->
                    <div class="form-group">
                        <label for="specificName">Individual Name (optional)</label>
                        <input
                            type="text"
                            id="specificName"
                            name="specificName"
                            placeholder="e.g., Dranzer, Beckett"
                        >
                    </div>

                    <!-- Behavior -->
                    <div class="form-group">
                        <label for="behavior">Behavior / Notes</label>
                        <textarea
                            id="behavior"
                            name="behavior"
                            placeholder="What was the bird doing? Any notable behaviors?"
                            rows="3"
                        ></textarea>
                    </div>

                    <!-- Date & Time -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="dateTime">Date & Time</label>
                            <input
                                type="datetime-local"
                                id="dateTime"
                                name="dateTime"
                                required
                            >
                        </div>

                        <!-- Time of Day -->
                        <div class="form-group">
                            <label for="timeOfDay">Time of Day</label>
                            <select id="timeOfDay" name="timeOfDay" required>
                                <option value="">Select...</option>
                                <option value="dawn">Dawn (5am-7am)</option>
                                <option value="morning">Morning (7am-12pm)</option>
                                <option value="afternoon">Afternoon (12pm-5pm)</option>
                                <option value="evening">Evening (5pm-8pm)</option>
                                <option value="dusk">Dusk (8pm-10pm)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Weather -->
                    <div class="form-group">
                        <label for="weather">Weather</label>
                        <select id="weather" name="weather" required>
                            <option value="">Select weather...</option>
                            <option value="sunny">Sunny</option>
                            <option value="cloudy">Cloudy</option>
                            <option value="rainy">Rainy</option>
                            <option value="overcast">Overcast</option>
                            <option value="partly-cloudy">Partly Cloudy</option>
                        </select>
                    </div>

                    <!-- Surrounding Conditions -->
                    <div class="form-group">
                        <label for="conditions">Surrounding Conditions</label>
                        <textarea
                            id="conditions"
                            name="conditions"
                            placeholder="Location, habitat, nearby activity, etc."
                            rows="2"
                        ></textarea>
                    </div>

                    <!-- Photo Upload (v2 feature) -->
                    <div class="form-group">
                        <label for="photoUrl">Photo URL (coming soon)</label>
                        <input
                            type="text"
                            id="photoUrl"
                            name="photoUrl"
                            placeholder="Photo upload coming in v2"
                            disabled
                        >
                        <small class="help-text">Photo uploads will be available in the next version</small>
                    </div>

                    <!-- Submit -->
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Log Sighting</button>
                        <button type="reset" class="btn btn-secondary">Clear</button>
                    </div>
                </form>

                <!-- Success Message -->
                <div id="successMessage" class="success-message hidden">
                    <strong>✓ Sighting logged!</strong> (We'll save to GitHub in v2)
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Raven's Eye v1.0 | Mobile-first bird watching</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
