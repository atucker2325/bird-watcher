<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raven's Eye - Bird Watcher Log</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <!-- Sleek, minimal gothic raven -->
                <svg class="raven-icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="ravenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#c9a961;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#8b7355;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <!-- Head -->
                    <circle cx="60" cy="35" r="18" fill="url(#ravenGradient)"/>
                    <!-- Beak -->
                    <path d="M 75 35 L 92 33 L 75 38 Z" fill="url(#ravenGradient)"/>
                    <!-- Eye -->
                    <circle cx="66" cy="32" r="2.5" fill="#1a1a1a"/>
                    <!-- Body -->
                    <path d="M 50 52 Q 45 65 50 85 Q 60 92 70 85 Q 75 65 70 52 Q 60 48 60 48 Q 60 48 50 52" fill="url(#ravenGradient)"/>
                    <!-- Wing detail -->
                    <path d="M 55 60 Q 50 70 52 82" stroke="url(#ravenGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <path d="M 62 60 Q 68 70 67 82" stroke="url(#ravenGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <!-- Tail feathers -->
                    <path d="M 50 80 L 42 100" stroke="url(#ravenGradient)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <path d="M 60 82 L 60 102" stroke="url(#ravenGradient)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <path d="M 70 80 L 78 100" stroke="url(#ravenGradient)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                </svg>
                <h1>Raven's Eye</h1>
                <p class="tagline">A personal bird-watching log</p>
            </div>
        </header>

        <!-- Main Form -->
        <main class="main-content">
            <section class="form-section">
                <div class="form-header">
                    <!-- Minimal icon for log a sighting -->
                    <svg class="log-icon" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#c9a961;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#8b7355;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <!-- Raven head in profile -->
                        <circle cx="30" cy="22" r="12" fill="url(#logGradient)"/>
                        <!-- Beak -->
                        <path d="M 40 22 L 52 20 L 40 25 Z" fill="url(#logGradient)"/>
                        <!-- Eye -->
                        <circle cx="35" cy="20" r="1.5" fill="#1a1a1a"/>
                        <!-- Body -->
                        <ellipse cx="30" cy="42" rx="14" ry="16" fill="url(#logGradient)"/>
                        <!-- Wing outline -->
                        <path d="M 22 35 Q 18 42 20 50" stroke="url(#logGradient)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                    </svg>
                    <h2>Log a Sighting</h2>
                </div>

                <form id="sightingForm" class="sighting-form">
                    <!-- Bird Type -->
                    <div class="form-group">
                        <label for="birdType">Bird Type</label>
                        <select id="birdType" name="birdType" required>
                            <option value="">Select a bird...</option>
                            <option value="crow">Crow</option>
                            <option value="jay">Jay</option>
                            <option value="robin">Robin</option>
                            <option value="raven">Raven</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <!-- Specific Bird Name (optional) -->
                    <div class="form-group">
                        <label for="specificName">Individual Name (optional)</label>
                        <input
                            type="text"
                            id="specificName"
                            name="specificName"
                            placeholder="e.g., Dranzer, Beckett"
                        >
                    </div>

                    <!-- Behavior -->
                    <div class="form-group">
                        <label for="behavior">Behavior / Notes</label>
                        <textarea
                            id="behavior"
                            name="behavior"
                            placeholder="What was the bird doing? Any notable behaviors?"
                            rows="3"
                        ></textarea>
                    </div>

                    <!-- Date & Time -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="dateTime">Date & Time</label>
                            <input
                                type="datetime-local"
                                id="dateTime"
                                name="dateTime"
                                required
                            >
                        </div>

                        <!-- Time of Day -->
                        <div class="form-group">
                            <label for="timeOfDay">Time of Day</label>
                            <select id="timeOfDay" name="timeOfDay" required>
                                <option value="">Select...</option>
                                <option value="dawn">Dawn (5am-7am)</option>
                                <option value="morning">Morning (7am-12pm)</option>
                                <option value="afternoon">Afternoon (12pm-5pm)</option>
                                <option value="evening">Evening (5pm-8pm)</option>
                                <option value="dusk">Dusk (8pm-10pm)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Weather -->
                    <div class="form-group">
                        <label for="weather">Weather</label>
                        <select id="weather" name="weather" required>
                            <option value="">Select weather...</option>
                            <option value="sunny">Sunny</option>
                            <option value="cloudy">Cloudy</option>
                            <option value="rainy">Rainy</option>
                            <option value="overcast">Overcast</option>
                            <option value="partly-cloudy">Partly Cloudy</option>
                        </select>
                    </div>

                    <!-- Surrounding Conditions -->
                    <div class="form-group">
                        <label for="conditions">Surrounding Conditions</label>
                        <textarea
                            id="conditions"
                            name="conditions"
                            placeholder="Location, habitat, nearby activity, etc."
                            rows="2"
                        ></textarea>
                    </div>

                    <!-- Photo Upload (v2 feature) -->
                    <div class="form-group">
                        <label for="photoUrl">Photo URL (coming soon)</label>
                        <input
                            type="text"
                            id="photoUrl"
                            name="photoUrl"
                            placeholder="Photo upload coming in v2"
                            disabled
                        >
                        <small class="help-text">Photo uploads will be available in the next version</small>
                    </div>

                    <!-- Submit -->
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Log Sighting</button>
                        <button type="reset" class="btn btn-secondary">Clear</button>
                    </div>
                </form>

                <!-- Success Message -->
                <div id="successMessage" class="success-message hidden">
                    <strong>✓ Sighting logged!</strong> (We'll save to GitHub in v2)
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Raven's Eye v1.0 | Mobile-first bird watching</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
